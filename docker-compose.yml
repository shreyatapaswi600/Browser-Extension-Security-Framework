services:
  backend:
    build:
      context: .
      dockerfile: dynamic_analyzer_service/Dockerfile
    container_name: extensionguard-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://extensionguard:${POSTGRES_PASSWORD}@database:5432/extensionguard"
      DYNAMIC_QUEUE_ROOT: "/worker-queue"
      DYNAMIC_JOB_TIMEOUT_SECONDS: "90"
    volumes:
      - extension_uploads:/app/dynamic_analyzer_service/uploads
      - dynamic_worker_queue:/worker-queue
    depends_on:
      database:
        condition: service_healthy
      browser-worker:
        condition: service_started
    restart: unless-stopped

  browser-worker:
    build:
      context: ./dynamic_browser_worker
      dockerfile: Dockerfile
    image: extensionguard-browser-worker:stage1
    container_name: extensionguard-browser-worker
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    shm_size: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /work/tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - extension_uploads:/data/uploads:ro
      - dynamic_worker_queue:/work/queue
    restart: unless-stopped

  database:
    image: postgres:17
    container_name: extensionguard-database
    environment:
      POSTGRES_DB: extensionguard
      POSTGRES_USER: extensionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extensionguard -d extensionguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  extension_uploads:
  dynamic_worker_queue:
    external: true
    name: extensionguard_dynamic_worker_queue
